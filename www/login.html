<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="visually-hidden-focusable skip-link" href="#main-content">Skip to main content</a>

    <main id="main-content" class="container content" style="max-width: 440px; padding-top: 4rem;">
        <section class="content-card" aria-labelledby="login-heading">
            <h2 id="login-heading">Student Login</h2>
            <p>Sign in with your student ID or email to view and manage your profile.</p>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label for="input-student-id" class="form-label">Student ID or Email</label>
                    <input type="text" class="form-control" id="input-student-id" required>
                </div>
                <div class="mb-3">
                    <label for="input-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="input-password" required>
                </div>
                <p class="text-danger d-none" id="login-error"></p>
                <button type="submit" class="btn-home">Login</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p class="mb-0"><em>&copy; 2026 Earl Andre H. Valmorida. All Rights Reserved.</em></p>
    </footer>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
